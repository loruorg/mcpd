[package]
name = "mcpd-conformance-probe"
version = "0.0.0"
edition = "2021"
publish = false
# Two binaries: the trace probe (the default) and the runs probe.
default-run = "mcpd-conformance-probe"

[dependencies]
mcpd-sdk = { path = "../../../../crates/mcpd-sdk" }
mcpd-core = { path = "../../../../crates/mcpd-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"

# A workspace of its own, so a checkout nested in another (a git worktree)
# does not adopt the outer one.
[workspace]
