apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcpd-data
  labels:
    app.kubernetes.io/name: mcpd
spec:
  accessModes:
    # ReadWriteOnce, and not because of a quota. SQLite locking is only correct
    # on a local block device: on NFS or any other shared filesystem the locks
    # are advisory at best and the database will eventually be corrupted.
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: gp3
