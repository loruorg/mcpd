{{- if not .Values.keys.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-keys" (include "mcpd.fullname" .) }}
  labels:
    {{- include "mcpd.labels" . | nindent 4 }}
type: Opaque
stringData:
  ingest-keys: {{ required "keys.ingest is required: mcpd accepts writes from anything that can reach it until an ingest key is set. Generate one with `openssl rand -hex 32`." .Values.keys.ingest | quote }}
  read-keys: {{ required "keys.read is required: stored prompts and completions are readable by anything that can reach the API until a read key is set. Generate one with `openssl rand -hex 32`." .Values.keys.read | quote }}
  {{- if .Values.keys.write }}
  write-keys: {{ .Values.keys.write | quote }}
  {{- end }}
  {{- if .Values.keys.admin }}
  admin-keys: {{ .Values.keys.admin | quote }}
  {{- end }}
  {{- if .Values.keys.execute }}
  execute-keys: {{ .Values.keys.execute | quote }}
  {{- end }}
  {{- if .Values.keys.worker }}
  worker-keys: {{ .Values.keys.worker | quote }}
  {{- end }}
  {{- if .Values.forward.headers }}
  forward-headers: {{ join "," .Values.forward.headers | quote }}
  {{- end }}
  {{- if .Values.smtp.password }}
  smtp-password: {{ .Values.smtp.password | quote }}
  {{- end }}
  {{- if .Values.oidc.clientSecret }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.oidc.scimToken }}
  scim-token: {{ .Values.oidc.scimToken | quote }}
  {{- end }}
  {{- if .Values.keys.redact }}
  redact-key: {{ .Values.keys.redact | quote }}
  {{- end }}
  {{- $type := include "mcpd.storeType" . }}
  {{- if and (eq $type "postgres") .Values.externalStore.postgresUrl }}
  postgres-url: {{ .Values.externalStore.postgresUrl | quote }}
  {{- end }}
  {{- if and (eq $type "clickhouse") .Values.externalStore.clickhouseUrl }}
  clickhouse-url: {{ .Values.externalStore.clickhouseUrl | quote }}
  {{- end }}
  {{- if .Values.externalStore.clickhousePassword }}
  clickhouse-password: {{ .Values.externalStore.clickhousePassword | quote }}
  {{- end }}
{{- end }}
