{{/*
  The daemon's --config-file, for the settings too structured for an
  environment variable. Rendered only from configFile.content; a Secret named in
  configFile.existingSecret is yours and the chart writes nothing for it.

  A ConfigMap by default, a Secret when configFile.kind says so. The Deployment
  refuses a ConfigMap whose content carries a credential, for the reason given
  beside configFile in values.yaml.
*/}}
{{- if and .Values.configFile.content (not .Values.configFile.existingSecret) }}
apiVersion: v1
kind: {{ .Values.configFile.kind }}
metadata:
  name: {{ printf "%s-config" (include "mcpd.fullname" .) }}
  labels:
    {{- include "mcpd.labels" . | nindent 4 }}
{{- if eq .Values.configFile.kind "Secret" }}
type: Opaque
stringData:
{{- else }}
data:
{{- end }}
  mcpd.json: {{ .Values.configFile.content | toPrettyJson | quote }}
{{- end }}
