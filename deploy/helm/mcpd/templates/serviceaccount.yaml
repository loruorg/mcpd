{{/*
  The review question this answers: "what identity does this pod run as, and
  what can that identity do to the cluster?"

  Off by default, so this renders nothing and the pod keeps using the
  namespace's `default` ServiceAccount. Turning it on is worth doing for the
  second half of the answer more than the first: mcpd never calls the
  Kubernetes API, so the account it gets has no RoleBinding and no mounted
  token.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcpd.serviceAccountName" . }}
  labels:
    {{- include "mcpd.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# A mounted token is a cluster credential sitting in a container that has no use
# for one, and it is the first thing anyone who reaches the filesystem looks
# for. The Deployment sets the same field on the pod, because the pod-level
# setting is the one that wins.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
