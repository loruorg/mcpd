{{/*
  The review question this answers: "is the collector itself monitored, and does
  scraping it need a credential?"

  Off by default, because this object needs the Prometheus Operator's CRDs
  installed in the cluster. With them absent, `helm install` fails on a kind the
  API server does not know.

  There is no bearer token below and that is not an oversight: mcpd serves
  /metrics with no key, so anything that can reach the port can read it. What it
  exposes is counters and uptime, not stored prompts or completions. The
  NetworkPolicy in this chart is what decides who can reach the port at all, and
  it cannot allow a scraper in without also allowing it at the query API. See
  the comment at the top of networkpolicy.yaml.
*/}}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mcpd.fullname" . }}
  labels:
    {{- include "mcpd.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceMonitor.namespace }}
  namespace: {{ . | quote }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mcpd.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
