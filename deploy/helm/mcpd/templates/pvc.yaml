{{- /* A claim whenever the pod keeps a file: the signal store on the embedded
       store, the run store with an external one. */}}
{{- if and (include "mcpd.localState" .) .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-data" (include "mcpd.fullname" .) }}
  labels:
    {{- include "mcpd.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
