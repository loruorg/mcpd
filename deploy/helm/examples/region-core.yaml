# The core region: several daemon replicas against one Postgres.
#
#   helm install mcpd ../mcpd -f region-core.yaml --set keys.existingSecret=mcpd-keys
#
# The Secret carries ingest-keys, read-keys and postgres-url. The run store is
# an embedded file, so it is off here; every replica serves ingest and queries,
# and /readyz takes a replica out of the Service while it cannot reach the
# database. Idempotency keys live in the database, so a batch a relay resends
# to another replica is stored once.
#
# Per-minute ceilings are counted by each replica, so divide the one you want
# by replicaCount. Monitors, objectives and aspect analysis run on every
# replica that has them: keep them in this release only, not in the standby.
mode: daemon
replicaCount: 3
externalStore:
  type: postgres
runs:
  enabled: false
podDisruptionBudget:
  enabled: true
  minAvailable: 2
