# An edge relay, one per region your agents run in.
#
#   helm install mcpd-relay ../mcpd -f region-edge-relay.yaml \
#     --set keys.ingest=$EDGE_INGEST_KEY --set relay.upstreamKey=$CORE_INGEST_KEY
#
# Agents send to the relay a few milliseconds away. It writes each request to
# its volume before answering and ships it to the first upstream that answers,
# so the link between regions is crossed with retries, not by every agent.
mode: relay
relay:
  upstreams:
    - https://mcpd.eu-west.example:4317
    - https://mcpd.us-east.example:4317
spool:
  maxBytes: 4294967296
persistence:
  enabled: true
  size: 8Gi
