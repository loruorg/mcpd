# A second region's daemons, against the same Postgres as region-core.yaml.
#
#   helm install mcpd ../mcpd -f region-standby.yaml --set keys.existingSecret=mcpd-keys
#
# They serve the relays of their own region and take over a core region's
# relays when it fails. Leave monitors, objectives and aspects out of this
# release's configFile, so each alert fires once.
mode: daemon
replicaCount: 2
externalStore:
  type: postgres
runs:
  enabled: false
podDisruptionBudget:
  enabled: true
  minAvailable: 1
