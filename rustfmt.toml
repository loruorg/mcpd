# The code in this repository is written to 100 columns, and its function calls
# are written to the same 100 rather than to rustfmt's much narrower default for
# calls, structs and arrays. Without `use_small_heuristics = "Max"` rustfmt
# breaks a call that fits comfortably on one line, which fights every file here.
max_width = 100
use_small_heuristics = "Max"
