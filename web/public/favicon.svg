<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="mcpd">
  <!-- The mark: three spans of a waterfall on an ink tile. Same as the rail. -->
  <style>
    .tile { fill: #0f1412 } .bar { fill: #f6f7f5 } .lit { fill: #0b7a53 }
    @media (prefers-color-scheme: dark) { .tile { fill: #eceeed } .bar { fill: #0b0d0c } .lit { fill: #0b7a53 } }
  </style>
  <rect class="tile" width="32" height="32" rx="8"/>
  <rect class="bar" x="7" y="8.5" width="13" height="3.6" rx="1.8"/>
  <rect class="lit" x="11.5" y="14.2" width="13" height="3.6" rx="1.8"/>
  <rect class="bar" x="9.3" y="19.9" width="8.5" height="3.6" rx="1.8" opacity=".7"/>
</svg>
