[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpd"
version = "0.1.0"
description = "Agent observability and durable runs for Python. Traces, logs, metrics, scores and feedback sent to an mcpd daemon, and workflows served from your own process."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "mcpd contributors" }]
keywords = ["observability", "tracing", "agents", "llm", "opentelemetry", "mcpd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

# No required dependencies, deliberately. The exporter runs on `urllib` and
# `gzip` from the standard library, so installing mcpd adds nothing to a
# lockfile and cannot conflict with what the agent already depends on.
dependencies = []

[project.optional-dependencies]
# Connection reuse, nothing more. The SDK behaves identically without it.
httpx = ["httpx>=0.28.1"]

[project.urls]
Homepage = "https://mcpd.sh"
Documentation = "https://mcpd.sh/docs"
Source = "https://github.com/mcpd/mcpd"

[tool.hatch.build.targets.wheel]
packages = ["mcpd"]

[tool.hatch.build.targets.sdist]
include = ["mcpd", "tests", "README.md", "LICENSE"]
