# Every commit in a pull request is signed off.
#
# Why this exists: CONTRIBUTING.md asks for a Signed-off-by trailer on every
# commit, as the record that the person who wrote it had the right to submit
# it under the project's licence. A rule nobody checks is a sentence, so this
# checks it, on every pull request, before a reviewer reads a line.
#
# The check itself is .github/scripts/dco-check.sh: a few lines of git rather
# than a third-party action, because every action in this repository is one
# more thing to pin and audit. It follows the DCO bot's rules: merge commits
# are exempt, and the trailer must name the author or the committer.
name: dco

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  sign-off:
    name: every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, because the check walks from the base of the
          # pull request to its head and a shallow clone has neither.
          fetch-depth: 0

      - name: check the trailer on every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/dco-check.sh "$BASE" "$HEAD"
