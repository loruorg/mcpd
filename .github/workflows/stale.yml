# Close the issues and pull requests that nobody is going to come back to.
#
# Why this exists: an issue tracker is only useful if its contents are true.
# A bug report that was fixed a year ago, or a draft pull request whose author
# has moved on, costs every later reader the time it takes to work out that it
# is dead. This gives each one a warning and a fortnight to answer.
#
# It is deliberately gentle. Anything a maintainer has taken responsibility
# for, by assigning it, milestoning it, or labelling it, is never touched.
name: stale

on:
  schedule:
    # Once a day, well away from the hour, so it does not queue behind the
    # flood of jobs that every cron at 00:00 produces.
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    name: mark and close stale threads
    # Never run on a fork. A fork's tracker is its own, and closing issues
    # there on this repository's schedule would be rude and wrong.
    if: github.repository == 'mcpd/mcpd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14

          stale-issue-label: stale
          stale-pr-label: stale

          stale-issue-message: >-
            There has been no activity here for 60 days, so this is marked
            stale and will close in 14 days.


            If it still matters, say so and it stays open. A comment saying
            what you are still seeing, on which version, is enough.
          stale-pr-message: >-
            There has been no activity here for 60 days, so this is marked
            stale and will close in 14 days.


            If you are still working on it, say so and it stays open. If you
            would rather someone else finished it, say that instead and it
            will be picked up.
          close-issue-message: >-
            Closing this after 74 days without activity. It is not a
            judgement on the report. Comment and it reopens.
          close-pr-message: >-
            Closing this after 74 days without activity. The branch is
            untouched, so comment and it reopens.

          # Anything a maintainer has picked up is not stale, whatever the
          # clock says. These four exemptions are what keep the bot from
          # closing the work that is actually queued.
          exempt-issue-labels: 'pinned,security,roadmap,help wanted'
          exempt-pr-labels: 'pinned,security,roadmap,dependencies'
          exempt-all-assignees: true
          exempt-all-milestones: true

          # Rewriting the timestamps would defeat the point of the count.
          remove-stale-when-updated: true
          # The default of 30 operations per run is low for a first pass over
          # an old tracker. This is still well inside the API rate limit.
          operations-per-run: 100
          ascending: true
