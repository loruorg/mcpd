# A spell check over everything a reader will see.
#
# Why this exists: AGENTS.md makes prose part of the contract, and the
# documentation site reads its code samples straight out of the example
# programs. A typo in a comment therefore ships to the website, and a typo in
# an identifier ships to five SDKs at once. Nothing else in CI reads prose.
#
# typos is pinned to an exact release on purpose. Its dictionary grows between
# versions, so an unpinned run can start failing on a file nobody touched.
name: spellcheck

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The allowlist lives here rather than in a repository-root _typos.toml
      # because it is small and every entry needs the sentence explaining why
      # it is allowed. Each one below was checked against the tree: they are
      # real identifiers and real terms, not typos being waved through. If the
      # list outgrows this block, move it to _typos.toml at the repository root
      # and drop the `config` input on the next step.
      - name: write the allowlist
        env:
          CONFIG: ${{ runner.temp }}/typos.toml
        run: |
          cat > "$CONFIG" <<'TOML'
          [files]
          # Lock files are machine-written dependency names, not prose. A new
          # dependency should never be able to fail the spell check.
          # THIRD_PARTY.md is generated from those same lock files, so it is
          # excluded for the same reason: crate and package names such as
          # flate2 and writeable read as typos and are not.
          # Blog posts are committed by an outside writer and are live before
          # this runs, so a finding here could only fail main after the fact.
          extend-exclude = ["Cargo.lock", "**/package-lock.json", "THIRD_PARTY.md", "web/src/content/blog/"]

          [default]
          # Trace and span ids are lower-case hex. The span id from the W3C
          # Trace Context examples, 00f067aa0ba902b7, appears across the Rust
          # crates, all five SDKs and the documentation, and the dictionary
          # reads the two letters before 902b7 in it as a misspelling of
          # "by". Mask long hex runs instead of allowing that pair as a word,
          # which would hide a real typo in prose.
          extend-ignore-re = ["\\b[0-9a-f]{16,}\\b"]

          [default.extend-words]
          # The project's own vocabulary. Listed so a future dictionary
          # release cannot decide one of these is a mistake.
          mcpd = "mcpd"
          OTLP = "OTLP"
          ClickHouse = "ClickHouse"
          Astro = "Astro"
          annunciator = "annunciator"
          traceparent = "traceparent"
          tracestate = "tracestate"

          # Identifiers, checked one by one against the code that uses them.
          als = "als"          # AsyncLocalStorage, sdks/typescript/src/context.ts
          dout = "dout"        # output details, crates/mcpd-core/src/cost.rs
          thr = "thr"          # thread_id column alias, ClickHouse queries
          expres = "expres"    # experiment result key prefix, internal notes
          abd = "abd"          # a deliberate near-miss in a constant_time_eq test
          Statuss = "Statuss"  # AllSpanStatuss, generated by tools/codegen
          Ded = "Ded"          # the tail of "ANDed", how search terms combine
          BRIN = "BRIN"        # a Postgres index type
          unparseable = "unparseable"  # British spelling, crates/mcpd-server
          TOML
          cat "$CONFIG"

      - name: check spelling
        uses: crate-ci/typos@a8168dc2984a9e2352f183ffe788f0f23a300389 # v1.49.1
        with:
          config: ${{ runner.temp }}/typos.toml
