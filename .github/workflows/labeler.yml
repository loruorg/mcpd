name: labeler

# pull_request_target rather than pull_request: adding a label needs write
# access to the pull request, and a run triggered by a fork does not have it.
# This job checks nothing out and runs no code from the branch, which is what
# makes that trigger safe to use here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label by path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # Paths add labels here and never remove one, so a label a maintainer
          # put on by hand survives the next push.
          sync-labels: false
