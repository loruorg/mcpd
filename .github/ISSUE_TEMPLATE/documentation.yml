name: Documentation
description: A page that is wrong, missing, or that you could not follow.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Some of the documentation is not written by hand, so the fix goes to
        the source rather than to the page:

        - Everything under `/docs/reference` is generated from
          `spec/mcpd.spec.json`, down to the description of each field.
        - Code samples are read out of `examples/` when the site is built. A
          page names a file and a region in it and keeps no copy of the code,
          so a sample that is wrong on the page is wrong in the example, and
          the example is run in CI.

        Report it here either way. Naming the page is enough, and we will find
        which of the two it is.

  - type: input
    id: page
    attributes:
      label: Which page
      description: The URL, or the path in the repository. More than one is fine.
      placeholder: "https://mcpd.sh/docs/sampling"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong with it
      options:
        - "It is wrong: the daemon does something else"
        - "It is out of date: this changed and the page did not"
        - "Something is missing"
        - "It is unclear, or it can be read two ways"
        - "A code sample does not run"
        - "The API reference does not match what the daemon returns"
        - "A broken or wrong link"
        - "I could not read it: contrast, keyboard, or a screen reader"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What were you trying to do, and where did the page leave you?
      description: >-
        The task, then the sentence or the sample that stopped being enough.
        Quote the line if you can. That is usually the whole bug.
      placeholder: |
        I wanted to keep one run in ten. The sampling page says the decision is
        made at the root and inherited, and I could not tell whether a span
        that arrives with a traceparent from another service is inside that
        decision or outside it.
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Which language tab were you reading?
      description: >-
        The documentation shows every sample in the language you pick, and one
        language can be wrong on a page where the rest are right.
      options:
        - "TypeScript"
        - "Python"
        - "Rust"
        - "Go"
        - "Kotlin"
        - "Elixir"
        - "cURL"
        - "Not language specific"
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What should it say instead?
      description: >-
        Optional. Rough wording is welcome, and so is a pull request. If you
        would rather send one, `AGENTS.md` has the house prose rules and says
        which files a documentation change is allowed to touch.
