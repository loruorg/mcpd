# The three forms cover a bug, a feature request and a documentation fix. A
# question fits none of them, and SUPPORT.md sends a question here rather than
# to a forum, because an answer in public helps the next person who asks. So a
# blank issue stays available, and the links below say where else to look
# first.
blank_issues_enabled: true

contact_links:
  - name: Documentation
    url: https://mcpd.sh/docs
    about: The quickstart, the data model, every flag, and the API reference.

  - name: How to ask a question
    url: https://github.com/mcpd/mcpd/blob/main/SUPPORT.md
    about: >-
      There is no separate forum. Open an issue, say in the title that it is a
      question, and the answer stays where the next person will find it.

  - name: Report a security vulnerability
    url: https://github.com/mcpd/mcpd/security/policy
    about: Email hi@mcpd.sh. Never open a public issue for a vulnerability.
