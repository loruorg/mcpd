name: Feature request
description: Something about your agents you cannot see today.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the question you could not answer, not the feature you think
        answers it. A feature name tells us what you designed. The question
        tells us what you needed, and there is often a shorter route to it
        than the one you had in mind.

  - type: textarea
    id: cannot-see
    attributes:
      label: What can you not see about your agent today?
      description: >-
        The question you were trying to answer, and the exact point where mcpd
        stopped being able to answer it. Name the screen, the endpoint or the
        field you got to before you ran out.
      placeholder: |
        I want to know which tool call made yesterday expensive. The cost
        breakdown totals by model, so I can see that the day cost more than
        the day before, and not which step spent it.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What do you do instead today?
      description: >-
        A query against the store by hand, an export, a second tool, or
        nothing at all. The workaround shows how much of the answer already
        exists and where it falls short.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where would the answer show up?
      description: A guess is fine. It is a starting point, not a commitment.
      options:
        - "The interface at http://localhost:4317"
        - "The query API under /v1/api"
        - "The SDKs"
        - "Ingest: a mapping, a semantic convention, a signal"
        - "Storage, retention or a backend"
        - "Alerting: watches, service level objectives, scoring"
        - "Configuration, or how it is deployed"
        - "The documentation"
        - "Not sure"
    validations:
      required: true

  - type: checkboxes
    id: sdks
    attributes:
      label: Which SDKs would need it?
      description: >-
        Tick the ones you use. A behaviour holds in every language or in none,
        which is what `sdks/SDK-CONTRACT.md` binds, so the ones you leave
        unticked get built too. This tells us where to start, not where to
        stop.
      options:
        - label: TypeScript
        - label: Python
        - label: Rust
        - label: Go
        - label: Kotlin
        - label: Elixir
        - label: "None: this is the daemon, the interface or the API"

  - type: textarea
    id: shape
    attributes:
      label: What would the answer look like?
      description: >-
        Optional, and worth a minute if you have one. A chart, a column, a
        response body, a flag, a line in the trace view. Sketch it in words or
        paste the JSON you wish you could get back.

  - type: checkboxes
    id: before-you-post
    attributes:
      label: Before you post
      options:
        - label: I searched the open and closed issues for this.
          required: true
