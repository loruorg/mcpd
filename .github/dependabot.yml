# Every manifest in this repository that resolves a third-party dependency has
# an entry here. Five are left out, and each for a reason:
#
#   examples/typescript, examples/go and tests/e2e/probes reach the SDK in this
#   working tree through a `file:` path and a `replace` directive, so no
#   published version exists for anything to bump.
#
#   deploy/docker/docker-compose.yml pins ghcr.io/mcpd/mcpd, the image this
#   project publishes. That version follows a release, not an update run.
#
#   examples/kotlin builds against the published Kotlin SDK and pins the Gradle
#   plugin that sdks/kotlin uses. Moving one of them alone would split the two
#   apart, and the examples job in CI does not compile this one, so nothing
#   would catch it.
#
# Updates land on one morning rather than through the week, and minor and patch
# bumps are grouped per ecosystem, so review is one pass over one pull request
# instead of a trickle. Majors stay on their own, because that is the pull
# request worth reading line by line.

version: 2

updates:
  # ----------------------------------------------------------------- the daemon
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        update-types: ["minor", "patch"]

  # The conformance probe is excluded from the workspace on purpose, so the
  # entry above does not reach it and it would otherwise never be updated.
  - package-ecosystem: cargo
    directory: "/tests/e2e/probes/rust"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      conformance-probe:
        update-types: ["minor", "patch"]

  # -------------------------------------------------------------------- the site
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The Radix packages are versioned together and used together by the
      # primitives in web/src/components/ui, so they are reviewed together.
      radix:
        patterns: ["@radix-ui/*"]
      astro:
        patterns: ["astro", "@astrojs/*"]
      site:
        update-types: ["minor", "patch"]

  # --------------------------------------------------------------------- the SDKs
  - package-ecosystem: npm
    directory: "/sdks/typescript"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      typescript-sdk:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/sdks/python"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-sdk:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: "/sdks/go"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-sdk:
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    directory: "/sdks/kotlin"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      kotlin-sdk:
        update-types: ["minor", "patch"]

  # The Python and Elixir SDKs are written against their standard libraries and
  # declare no required dependency, which is a property worth keeping. These two
  # entries exist to notice the first one that appears.
  - package-ecosystem: mix
    directory: "/sdks/elixir"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      elixir-sdk:
        update-types: ["minor", "patch"]

  # ------------------------------------------------------- how it ships and builds
  # The base images in the root Dockerfile. A newer Rust image is safe: the
  # minimum supported version is a floor in Cargo.toml, not a pin.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      base-images:
        update-types: ["minor", "patch"]

  # Two directories: the workflows, and the composite action the conformance
  # and e2e jobs share. Dependabot reads action.yml files only in a directory
  # it is pointed at, so without the second entry the pins in
  # .github/actions/conformance-setup would never move.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      # CONTRIBUTING.md allows feat, fix, chore, docs, refactor, test and perf.
      # A prefix outside that list would be the first commit on main to break
      # the convention the file asks contributors to follow.
      prefix: chore
      include: scope
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/.github/actions/conformance-setup"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        update-types: ["minor", "patch"]
