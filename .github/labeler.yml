# Path labels for pull requests, read by .github/workflows/labeler.yml.
# The syntax is actions/labeler v5.
#
# These labels have to exist in the repository. This file selects them by path;
# it does not define them, and it sets no colour or description. Create them
# once, then leave this file to decide which ones land.
#
# The areas follow the review table in MAINTAINERS.md, so a label names the
# area a review has to cover. Within that, a path decides the label, and there
# is nothing to keep in step by hand.

"area: spec":
  - changed-files:
      - any-glob-to-any-file:
          - "spec/**"
          - "tools/codegen/**"

"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/mcpd-core/**"

"area: storage":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/mcpd-store/**"

"area: daemon":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/mcpd/**"
          - "crates/mcpd-server/**"
          # The workspace manifest and the Rust formatting rules govern every
          # crate, and a dependency update lands on them and nowhere else.
          - "Cargo.toml"
          - "Cargo.lock"
          - "rustfmt.toml"

"area: web":
  - changed-files:
      - any-glob-to-any-file:
          - "web/**"
          # Share images, rendered from the same tokens as the pages.
          - "tools/og.mjs"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "web/src/pages/docs/**"
          - "web/src/content/**"
          - "README.md"
          - "AGENTS.md"
          - "CLAUDE.md"
          - "DESIGN.md"
          - "PRODUCT.md"
          - "sdks/**/README.md"
          - "crates/**/README.md"

# MAINTAINERS.md reviews the governance documents apart from the rest, because
# they decide who can merge rather than how the code behaves.
"area: governance":
  - changed-files:
      - any-glob-to-any-file:
          - "CODE_OF_CONDUCT.md"
          - "CONTRIBUTING.md"
          - "CONTRIBUTOR_LICENSE_AGREEMENT.md"
          - "MAINTAINERS.md"
          - "SECURITY.md"
          - "SUPPORT.md"
          - "LICENSE"
          - ".github/CODEOWNERS"

"area: deploy":
  - changed-files:
      - any-glob-to-any-file:
          - "deploy/**"
          # Spelled out because a leading dot is not always inside "**".
          - "deploy/**/.*"
          - "Dockerfile"
          - ".dockerignore"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "Makefile"
          - "tools/check-consistency.mjs"

"area: examples":
  - changed-files:
      - any-glob-to-any-file:
          - "examples/**"

"area: tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

# Its own label, and its own area in MAINTAINERS.md: a change here is a change
# to what every SDK has to do, in every language at once.
"sdk: contract":
  - changed-files:
      - any-glob-to-any-file:
          - "sdks/SDK-CONTRACT.md"

"sdk: typescript":
  - changed-files:
      - any-glob-to-any-file:
          - "sdks/typescript/**"

"sdk: python":
  - changed-files:
      - any-glob-to-any-file:
          - "sdks/python/**"

"sdk: rust":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/mcpd-sdk/**"

"sdk: go":
  - changed-files:
      - any-glob-to-any-file:
          - "sdks/go/**"

"sdk: kotlin":
  - changed-files:
      - any-glob-to-any-file:
          - "sdks/kotlin/**"

"sdk: elixir":
  - changed-files:
      - any-glob-to-any-file:
          - "sdks/elixir/**"

# A pull request that carries this label and no "area: spec" label is worth a
# second look: a generated file changed without the spec that produces it.
"generated":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/mcpd-core/src/generated.rs"
          - "sdks/typescript/src/generated.ts"
          - "sdks/python/mcpd/_generated.py"
          - "sdks/go/generated.go"
          - "sdks/kotlin/src/main/kotlin/dev/mcpd/Generated.kt"
          - "sdks/elixir/lib/mcpd/generated.ex"
          - "web/src/generated/types.ts"
          - "web/src/content/reference/*.md"
          - "spec/openapi.json"
