[package]
name = "mcpd-store"
description = "Storage backends for mcpd: an embedded SQLite store that needs nothing, and a ClickHouse store for scale."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["sqlite", "clickhouse", "postgres"]
# The zero-dependency path: SQLite is compiled in, so `mcpd` is one binary.
sqlite = ["dep:rusqlite"]
# For deployments where retention is measured in billions of spans.
clickhouse = ["dep:reqwest"]
# For deployments that already run Postgres and do not want a second database.
postgres = [
    "dep:tokio-postgres",
    "dep:deadpool-postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:webpki-roots",
]

[dependencies]
mcpd-core.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
hex.workspace = true
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled", "serde_json", "time", "backup"], optional = true }
reqwest = { workspace = true, optional = true, features = ["query"] }
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
futures = "0.3"
