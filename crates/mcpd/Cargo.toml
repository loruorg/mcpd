[package]
name = "mcpd"
description = "The mcpd daemon: durable runs and observability for agents in one static binary. It holds a run between steps, your code does the work inside them, and every step is on the record."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "mcpd"

[[bin]]
name = "mcpd"
path = "src/main.rs"

[dependencies]
mcpd-core.workspace = true
mcpd-store.workspace = true
mcpd-runs.workspace = true
mcpd-server.workspace = true
# `io-std` and `io-util` are for the MCP subcommand, which speaks JSON-RPC
# over stdin and stdout.
tokio = { workspace = true, features = ["io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
clap = { version = "4", features = ["derive", "env"] }
# The MCP subcommand is an HTTP client of a deployed daemon. This is already
# in the binary through mcpd-server, so it costs the build nothing new.
reqwest.workspace = true
axum = "0.8"
