[package]
name = "mcpd-server"
description = "The mcpd HTTP server: OTLP and native ingest, the query API, the run and worker surface, and the embedded operator UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Forwarding spans on to another OTLP collector.
reqwest.workspace = true
mcpd-core.workspace = true
mcpd-store.workspace = true
mcpd-runs.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hex.workspace = true
sha2.workspace = true
# `http2` so the one listener also takes cleartext HTTP/2, which is how gRPC
# reaches the OTLP and Jaeger services in `grpc.rs`.
axum = { version = "0.8", features = ["macros", "http2"] }
# The trailers a gRPC answer ends with.
http-body-util = "0.1"
tower = "0.5"
# `catch-panic` turns a panic in a handler into a 500 in the JSON error shape,
# rather than a dropped connection the client can read nothing from.
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "set-header", "limit", "timeout", "catch-panic"] }
# `rt` is for the task tracker that holds in-flight forwards so shutdown can
# wait for them, and the cancellation token the background loops watch.
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
flate2 = "1"
futures = "0.3"
# Reading a gRPC export's answer, which arrives in the HTTP/2 trailers.
mime = "0.3"
async-trait = "0.1"
include_dir = "0.7"
# Accounts, for `--signup`. Their own small file beside the signal store, so the
# three signal backends do not change. The same rusqlite the run store uses.
rusqlite = { version = "0.40", features = ["bundled"] }
# Password hashing for accounts, argon2id. No `rand` feature: the salt comes
# from the workspace's own `rand`, so no second random source is linked in.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rand.workspace = true
# OpenID Connect: id_token signatures are checked against the provider's JWKS,
# on the same aws-lc-rs provider rustls already links.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = "1"
base64 = "0.22"
# Mail for verification, reset and invites. rustls only: no OpenSSL, so the
# static musl build keeps working.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
# The enrolment code for two-step log-in, as SVG. No image dependencies.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# HTTP/2 for the scripted destinations, so the gRPC sender is tested against
# a server that speaks it.
axum = { version = "0.8", features = ["macros", "http2"] }
# `oneshot` drives the real router in-process, so an HTTP test exercises the
# actual routes, extractors, auth layer and error mapping rather than calling a
# handler function directly and proving nothing about the wiring.
tower = { version = "0.5", features = ["util"] }
mcpd-store = { workspace = true, features = ["sqlite"] }
# A real gRPC client for the OTLP and Jaeger services, and real protobuf
# encoders for the Zipkin and Jaeger messages, so the wire tests send what a
# stock exporter sends rather than bytes this repository wrote by hand.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "gzip", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"
flate2 = "1" 
