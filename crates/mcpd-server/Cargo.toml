[package]
name = "mcpd-server"
description = "The mcpd HTTP server: OTLP and native ingest, the query API, the run and worker surface, and the embedded operator UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Forwarding spans on to another OTLP collector.
reqwest.workspace = true
mcpd-core.workspace = true
mcpd-store.workspace = true
mcpd-runs.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
hex.workspace = true
sha2.workspace = true
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
# `catch-panic` turns a panic in a handler into a 500 in the JSON error shape,
# rather than a dropped connection the client can read nothing from.
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "set-header", "limit", "timeout", "catch-panic"] }
# `rt` is for the task tracker that holds in-flight forwards so shutdown can
# wait for them, and the cancellation token the background loops watch.
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
flate2 = "1"
futures = "0.3"
# Reading a gRPC export's answer, which arrives in the HTTP/2 trailers.
http-body-util = "0.1"
mime = "0.3"
async-trait = "0.1"
include_dir = "0.7"
# Accounts, for `--signup`. Their own small file beside the signal store, so the
# three signal backends do not change. The same rusqlite the run store uses.
rusqlite = { version = "0.40", features = ["bundled"] }
# Password hashing for accounts, argon2id. No `rand` feature: the salt comes
# from the workspace's own `rand`, so no second random source is linked in.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rand.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# HTTP/2 for the scripted destinations, so the gRPC sender is tested against
# a server that speaks it.
axum = { version = "0.8", features = ["macros", "http2"] }
# `oneshot` drives the real router in-process, so an HTTP test exercises the
# actual routes, extractors, auth layer and error mapping rather than calling a
# handler function directly and proving nothing about the wiring.
tower = { version = "0.5", features = ["util"] }
mcpd-store = { workspace = true, features = ["sqlite"] }
http-body-util = "0.1" 
