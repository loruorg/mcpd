[package]
name = "mcpd-sdk"
description = "The Rust SDK for mcpd. Instrument an agent, ship its spans, logs, metrics, scores and feedback, and serve the steps of its durable runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mcpd-core.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
thiserror.workspace = true
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
# Request bodies are gzipped above a kilobyte; reqwest's own gzip feature only
# decompresses responses.
flate2 = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

# The quickstart the documentation includes by reference. Keeping it a real
# example target is what stops it rotting: `cargo test` compiles it.
[[example]]
name = "quickstart"
path = "../../examples/rust/quickstart.rs"

# The durable-run example the documentation includes by reference, kept a
# real example target for the same reason.
[[example]]
name = "workflow"
path = "../../examples/rust/workflow.rs"
