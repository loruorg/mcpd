[package]
name = "mcpd-runs"
description = "The durable run core: definitions, runs, a cursor, step attempts, timers, waits and leases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
time.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
rand.workspace = true
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled", "serde_json", "time"] }
regex = "1"
jsonschema = { version = "0.56", default-features = false }
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The crash tests delete the rows a crash would lose, which needs a second
# connection to the same file rather than a hole in the trait.
rusqlite = { version = "0.40", features = ["bundled"] }
